server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проксируем API на backend. Прямой запрос из браузера невозможен
    # (страница по HTTPS, backend по HTTP — mixed content), поэтому проксируем
    # на стороне сервера. Префикс /api сохраняется (backend ждёт /api/v1/...).
    location /api/ {
        proxy_pass http://144.31.141.142:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: всё остальное отдаём через index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
